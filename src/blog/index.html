<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Swopnil Shrestha</title>
    <script>(function(){try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container site-main">
        <nav class="site-nav">
            <div class="nav-links">
                <a href="/">about</a>
                <a href="/work">work</a>
                <a href="/blog" aria-current="page">blog</a>
                <a href="https://pho.swopnil.com">photos</a>
            </div>
            <button class="theme-toggle" type="button" aria-label="Toggle light / dark theme" title="Toggle theme">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>
                </svg>
            </button>
        </nav>

        <header class="page-head">
            <h1>Blog</h1>
        </header>

        <main class="prose">
        {%- for post in collections.post | reverse -%}
            <div class="post-item">
                <h2 class="post-title"><a href="{{ post.url }}">{{ post.data.title }}</a></h2>
                <div class="post-date">{{ post.date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) }}</div>
            </div>
        {%- endfor -%}
        </main>
    </div>

    <footer class="site-footer">
        <div>
            <a href="https://github.com/swopnilnep" target="_blank">github</a>
            <a href="https://linkedin.com/in/swopnilnep" target="_blank">linkedin</a>
            <a href="/keys">pgp</a>
        </div>
        <div class="footer-site">swopnil.com</div>
    </footer>

    <script src="/theme.js"></script>
</body>
</html>
