<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} · Swopnil Shrestha</title>
    <meta name="description" content="{{ summary or title }}">
    <link rel="alternate" type="application/atom+xml" title="Swopnil Shrestha" href="/feed.xml">
    <script>(function(){try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container site-main">
        {% include "nav.njk" %}

        <article class="prose">
            <header class="blog-header page-head">
                <h1>{{ title }}</h1>
                <div class="post-meta">
                    <time datetime="{{ page.date.toISOString() }}">{{ page.date | readableDate }}</time>
                    <span aria-hidden="true">·</span> {{ content | readingTime }}
                </div>
            </header>
            {%- if summary %}
            <p class="post-summary">{{ summary }}</p>
            {%- endif %}
            <div class="blog-content">
                {{ content | safe }}
            </div>
        </article>
    </div>

    {% include "footer.njk" %}

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script>
        (function () {
            var t = document.documentElement.dataset.theme;
            var theme = t === 'dark' ? 'dark'
                      : t === 'light' ? 'neutral'
                      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'neutral');
            mermaid.initialize({ startOnLoad: true, theme: theme });
        })();
    </script>
    <script src="/theme.js"></script>
</body>
</html>
